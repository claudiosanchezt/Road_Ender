<!-- SVG placeholder para guía por defecto -->
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Decorative shapes -->
  <circle cx="350" cy="50" r="30" fill="white" opacity="0.1" filter="url(#blur)"/>
  <circle cx="50" cy="350" r="40" fill="white" opacity="0.15" filter="url(#blur)"/>
  <rect x="300" y="300" width="60" height="60" rx="10" fill="white" opacity="0.1" filter="url(#blur)"/>
  
  <!-- Avatar circle -->
  <circle cx="200" cy="180" r="80" fill="white" opacity="0.9"/>
  
  <!-- Person icon -->
  <g transform="translate(200, 180)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#6B7280"/>
    
    <!-- Body -->
    <path d="M -35 20 Q -35 0 -20 0 L 20 0 Q 35 0 35 20 L 35 60 L -35 60 Z" fill="#6B7280"/>
  </g>
  
  <!-- Guide badge -->
  <g transform="translate(280, 120)">
    <circle r="25" fill="#10B981"/>
    <text x="0" y="6" text-anchor="middle" fill="white" font-size="20" font-weight="bold">✓</text>
  </g>
  
  <!-- Bottom text -->
  <text x="200" y="320" text-anchor="middle" fill="white" font-size="24" font-weight="bold" opacity="0.9">
    Guía Experto
  </text>
  
  <text x="200" y="350" text-anchor="middle" fill="white" font-size="16" opacity="0.7">
    RoadEnder
  </text>
</svg>
