<!-- Imagen por defecto para zonas turísticas -->
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="landscapeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cielo -->
  <rect width="400" height="180" fill="url(#skyGradient)"/>
  
  <!-- Paisaje base -->
  <rect y="180" width="400" height="120" fill="url(#landscapeGradient)"/>
  
  <!-- Colinas -->
  <ellipse cx="100" cy="200" rx="80" ry="30" fill="#32CD32" opacity="0.8"/>
  <ellipse cx="300" cy="190" rx="100" ry="40" fill="#228B22" opacity="0.8"/>
  
  <!-- Árboles -->
  <g transform="translate(50, 170)">
    <rect x="12" y="20" width="6" height="25" fill="#8B4513"/>
    <polygon points="15,5 5,20 25,20" fill="#228B22"/>
  </g>
  
  <g transform="translate(150, 175)">
    <rect x="12" y="20" width="6" height="20" fill="#8B4513"/>
    <polygon points="15,8 8,25 22,25" fill="#32CD32"/>
  </g>
  
  <g transform="translate(320, 165)">
    <rect x="12" y="25" width="6" height="30" fill="#8B4513"/>
    <polygon points="15,5 5,25 25,25" fill="#006400"/>
  </g>
  
  <!-- Sendero -->
  <path d="M 0 220 Q 100 210 200 220 T 400 225" stroke="#D2B48C" stroke-width="15" fill="none" opacity="0.7"/>
  
  <!-- Texto -->
  <rect x="50" y="250" width="300" height="40" fill="rgba(0,0,0,0.6)" rx="5"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Zona Turística
  </text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF" opacity="0.8">
    Imagen no disponible
  </text>
</svg>
