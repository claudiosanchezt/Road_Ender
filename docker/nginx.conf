user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  upstream web_upstream {
    server web:3000;
  }

  upstream api_upstream {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 16M;

    # Cache static assets generated by Next
    location ~ ^/_next/static/.*$ {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_cache_valid 200 30d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
      proxy_pass http://web_upstream;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Expose API docs at /api/docs (map to backend /api-docs)
    location /api/docs {
      proxy_pass http://api_upstream/api-docs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API home routes should be served by the backend API service
    location /api/home/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy for API endpoints under /api/
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback: proxy all to Next app
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    # Basic health check
    location /_healthz {
      return 200 'ok';
    }
  }
}
